<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats | TrueFace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">TrueFace</a>
    <nav>
      <a href="detector.html">Detector</a>
      <a href="game.html">Beat the AI</a>
      <a href="stats.html" class="active">Stats</a>
    </nav>
  </header>

  <main class="page">
    <h1>Humans vs. AI: the stats</h1>
    <p class="intro">Live results from everyone who has played.</p>

    <div class="grid-2">
      <section class="card">
        <h2>Human accuracy</h2>
        <p class="stat-number" id="humanAccuracy">--%</p>
      </section>
      <section class="card">
        <h2>AI accuracy</h2>
        <p class="stat-number" id="aiAccuracy">--%</p>
      </section>
    </div>

    <section class="card">
      <h2>The fakes that fooled the most players</h2>
      <canvas id="foolChart" height="120"></canvas>
    </section>

    <section class="card">
      <h2>Do players improve over the rounds?</h2>
      <canvas id="roundChart" height="120"></canvas>
    </section>
  </main>

  <footer class="site-footer">
    <p>All faces are AI-generated or from public research datasets.</p>
  </footer>
</body>
</html>
